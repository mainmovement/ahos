# AHOS AI-PAL provider registry v1 (Wave-7 §13) — FREE-FIRST, provider-agnostic.
# Law: $0/month. Order per chain: local/self-hosted -> keyless-public -> free-tier keyed ->
# deterministic-only degraded mode. Iran accessibility is UNKNOWN until a probe id exists
# (engine/pal_probe.py --site user-iran, or ai probe) — no claim without evidence.
version: 1
capabilities:
  persian_parse:      # NLU assist for Persian free text (deterministic parser remains authoritative)
    chain: [ollama_local, github_models_gpt4omini, groq_llama, gemini_flash_free, openrouter_free]
  persian_explain:    # WHY explanations in Persian from deterministic evidence
    chain: [ollama_local, github_models_gpt4omini, groq_llama, gemini_flash_free, openrouter_free]

providers:
  ollama_local:
    kind: openai_compatible
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5:7b-instruct"    # strong Persian among free local models; overridable
    key_env: null                   # local server needs no key
    cost: free-local
    timeout_sec: 60
    status: DISABLED_NO_HOST        # requires VPS/laptop (blocker 2) — auto-joins chain when reachable
    iran_accessibility: LOCAL_IMMUNE
    note: "first in chain by law (Iran resilience); skipped silently until host exists"

  # REMOVED FROM CHAINS 2026-08-11 (kept as evidence, per no-silent-replacement law):
  # pollinations text API now answers HTTP 402 Payment Required — the keyless free tier is GONE.
  # Probe: PRB-20260811-AI-001 (reports/ai_provider_probe_20260811.json) + direct GET 402 verification.
  # pollinations_text: {kind: pollinations_get, base_url: "https://text.pollinations.ai",
  #                     model: "openai", key_env: null, cost: REFUTED-402-2026-08-11}

  github_models_gpt4omini:
    kind: openai_compatible
    base_url: "https://models.inference.ai.azure.com"
    model: "gpt-4o-mini"
    key_env: GITHUB_TOKEN           # free with any GitHub account
    cost: free-tier
    timeout_sec: 30
    status: NEEDS_USER_KEY
    iran_accessibility: UNKNOWN

  groq_llama:
    kind: openai_compatible
    base_url: "https://api.groq.com/openai/v1"
    model: "llama-3.3-70b-versatile"
    key_env: GROQ_API_KEY
    cost: free-tier
    timeout_sec: 30
    status: NEEDS_USER_KEY
    iran_accessibility: UNKNOWN      # signup may be geo-restricted; documented, not assumed

  gemini_flash_free:
    kind: openai_compatible
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    model: "gemini-2.0-flash"
    key_env: GEMINI_API_KEY         # AI Studio free tier
    cost: free-tier
    timeout_sec: 30
    status: NEEDS_USER_KEY
    iran_accessibility: UNKNOWN      # Google services sanctioned in IR; likely-filtered, probe required

  openrouter_free:
    kind: openai_compatible
    base_url: "https://openrouter.ai/api/v1"
    model: "meta-llama/llama-3.3-70b-instruct:free"
    key_env: OPENROUTER_API_KEY
    cost: free-tier
    timeout_sec: 30
    status: NEEDS_USER_KEY
    iran_accessibility: UNKNOWN
