version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: ahos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ahos
      POSTGRES_USER: ahos
      POSTGRES_PASSWORD: ahos123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ahos-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: