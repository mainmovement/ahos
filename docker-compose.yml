# ==============================================================================
# AHOS — laptop stack (single user, no VPS)
#
#   cp .env.example .env      # then set TELEGRAM_BOT_TOKEN
#   docker compose up -d
#   docker compose logs -f ahos-bot
#
# Docker is entirely OPTIONAL. `python run_bot.py` does the same thing without
# it. This file exists for the case where you want the scheduler, the bot and
# n8n running together and surviving a reboot.
#
# Everything binds to 127.0.0.1 only. Nothing on this stack is meant to be
# reachable from outside the laptop.
# ==============================================================================

services:
  # --- discovery/scoring cycles on a schedule --------------------------------
  ahos-core:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: ahos-runtime
    restart: unless-stopped
    env_file: [.env]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: ["python", "-m", "architecture.runtime"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,os;sqlite3.connect('/app/data/e01_discovery.sqlite').execute('select 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- the Persian conversational bot ----------------------------------------
  ahos-bot:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: ahos-bot
    restart: unless-stopped
    env_file: [.env]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    command: ["python", "run_bot.py"]
    depends_on:
      ahos-core:
        condition: service_started
    # A filtered network is the normal case here, not the exception: the bot
    # backs off and retries rather than exiting, so it recovers on its own when
    # the tunnel comes back.

  # --- n8n agent workflows ----------------------------------------------------
  # Import the JSON files in n8n/workflows/ once the UI is up at
  # http://127.0.0.1:5678
  n8n:
    image: n8nio/n8n:latest
    container_name: ahos-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Asia/Tehran
      N8N_DIAGNOSTICS_ENABLED: "false"      # no phone-home
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"            # plain http on loopback
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./data:/data

volumes:
  n8n_data:
