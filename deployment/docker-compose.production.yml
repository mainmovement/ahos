version: '3.8'

services:
  ahos-core:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: ahos-production-runtime
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
      - ../docs:/app/docs:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "/app/deployment/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: false
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
