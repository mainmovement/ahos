<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Comparison</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #1a1a1a;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      text-align: center;
      color: #d4af37;
    }
    .container {
      display: flex;
      gap: 40px;
      justify-content: center;
    }
    .side {
      flex: 1;
      max-width: 500px;
      text-align: center;
    }
    .side img {
      width: 100%;
      height: auto;
      border: 2px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    .side h2 {
      color: #fff;
      margin-top: 15px;
    }
    .side h3 {
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Dashboard Comparison</h1>
  <div class="container">
    <div class="side">
      <h2>Owner Reference</h2>
      <img src="reports/dashboard/screens/01_dashboard_fix/owner_reference.jpg" alt="Owner Reference">
      <h3>01_dashboard_target.jpg</h3>
    </div>
    <div class="side">
      <h2>Fixed Dashboard</h2>
      <img src="reports/dashboard/screens/01_dashboard_fix/dashboard_2026-10-16.png" alt="Fixed Dashboard">
      <h3>dashboard_2026-10-16.png</h3>
    </div>
  </div>
</body>
</html>
